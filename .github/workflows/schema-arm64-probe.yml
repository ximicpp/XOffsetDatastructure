name: Schema Windows ARM64 probe
on:
  push:
    branches: [codex/schema-cross-platform-runtime]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wire:
    if: github.repository == 'ximicpp/XOffsetDatastructure'
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download pinned inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content tools/schema_guard/github_arm64_inputs.json -Raw | ConvertFrom-Json
          $root = Join-Path $env:RUNNER_TEMP ("xsg-arm64-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($item in @(@{name="reference"; file="reference.zip"}, @{name="binary"; file="fixture.exe"})) {
            $entry = $config.($item.name)
            if ($entry.blob -notmatch "^[0-9a-f]{40}$") { throw "Invalid Git blob id" }
            $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs/$($entry.blob)"
            $response = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
            if ($response.sha -ne $entry.blob -or $response.encoding -ne "base64") { throw "Unexpected Git blob" }
            $path = Join-Path $root $item.file
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($response.content))
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant() -ne $entry.sha256) { throw "Input digest mismatch" }
          }
          "XSG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Execute Windows ARM64 bidirectional probe
        shell: pwsh
        run: |
          python tools/schema_guard/github_arm64_probe.py --input tools/schema_guard/github_arm64_inputs.json --binary "$env:XSG_ROOT/fixture.exe" --reference-zip "$env:XSG_ROOT/reference.zip" --out "$env:XSG_ROOT/out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows-produced corpus and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-arm64-wire
          path: ${{ env.XSG_ROOT }}/out
          if-no-files-found: error
          retention-days: 7
