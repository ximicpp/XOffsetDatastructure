name: CI-Structure

on:
  workflow_dispatch:

jobs:
  structure-check:
    name: Repository Structure Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify repository structure
        run: |
          echo "=== Key files ==="
          for f in \
            xoffsetdatastructure.hpp \
            xoffset_virtual_memory.hpp \
            build.sh \
            CMakeLists.txt \
            tests/CMakeLists.txt \
            external/typelayout/include/boost/typelayout.hpp; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f missing" && exit 1
            fi
          done

          echo ""
          echo "=== Submodule status ==="
          git submodule status

      - name: Validate test inventory against CMake
        run: |
          echo "Checking tests/CMakeLists.txt and cmake/XOffsetFourPathTests.cmake against tests/test_*.cpp ..."

          {
            awk '
              /set\(BASIC_TESTS/ {collect=1; next}
              /set\(REFLECTION_TESTS/ {collect=1; next}
              /set\(STORAGE_TESTS/ {collect=1; next}
              collect && /^\)/ {collect=0; next}
              collect && $1 ~ /^test_/ {print $1}
            ' tests/CMakeLists.txt
            awk '
              /set\(XOFFSET_FOUR_PATH_TEST_PROGRAMS/ {collect=1; next}
              collect && /^\)/ {collect=0; next}
              collect && $1 ~ /^test_/ {print $1}
              /^add_xoffset_test\(test_/ {sub(/^add_xoffset_test\(/, ""); print $1}
            ' cmake/XOffsetFourPathTests.cmake
          } | sort > /tmp/cmake_tests.txt

          ls tests/test_*.cpp | \
            sed 's|tests/||; s|\.cpp||' | \
            grep -vE '^test_polymorphic_(rejection|positive)$' | \
            sort > /tmp/test_files.txt

          echo "  CMake tests: $(wc -l < /tmp/cmake_tests.txt)"
          echo "  Source files: $(wc -l < /tmp/test_files.txt)"

          MISSING_IN_CMAKE=$(comm -23 /tmp/test_files.txt /tmp/cmake_tests.txt)
          MISSING_IN_FILES=$(comm -13 /tmp/test_files.txt /tmp/cmake_tests.txt)

          if [ -n "$MISSING_IN_CMAKE" ]; then
            echo ""
            echo "  ✗ Test files not listed in tests/CMakeLists.txt or cmake/XOffsetFourPathTests.cmake:"
            echo "$MISSING_IN_CMAKE" | sed 's/^/    - /'
            exit 1
          fi

          if [ -n "$MISSING_IN_FILES" ]; then
            echo ""
            echo "  ✗ CMake lists tests with no matching source file:"
            echo "$MISSING_IN_FILES" | sed 's/^/    - /'
            exit 1
          fi

          echo ""
          echo "  ✓ Test inventory is consistent"

      - name: Validate runner failure handling and measurement pairing
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 tools/test_benchmark_vm_stage1.py
