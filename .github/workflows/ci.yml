name: CI

on:
  push:
    branches: [ main, master, next_cpp26 ]
  pull_request:
    branches: [ main, master, next_cpp26 ]
  workflow_dispatch:

jobs:
  storage:
    name: C++17 OS storage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone storage
        run: cmake -S . -B build-storage -DXOFFSET_STORAGE_ONLY=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-storage --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-storage -C Release --output-on-failure --no-tests=error
      - name: Install, relocate, and consume the storage package
        run: python3 tools/validate_vm_package.py --source-dir . --out build-storage-package --suite storage
      - name: Save platform inventory and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-${{ matrix.os }}
          path: |
            build-storage/test-inventory.json
            build-storage/CMakeCache.txt
            build-storage/Testing/Temporary/*.log
            build-storage-package/result.json
            build-storage-package/*.log
            build-storage-package/*manifest*.json
            build-storage-package/*.xml

  test:
    name: Build & Test (P2996 Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify checkout
        run: |
          echo "=== Repository ==="
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo ""
          echo "=== Submodules ==="
          git submodule status
          echo ""
          echo "=== TypeLayout check ==="
          ls -la external/typelayout/include/boost/typelayout.hpp
          echo ""
          echo "=== Test files ==="
          ls tests/test_*.cpp | wc -l
          echo "test files found"

      - name: Pull P2996 Docker image
        run: |
          IMAGE=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["image"])')
          docker pull --platform linux/amd64 "$IMAGE"
          echo "XOFFSET_CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          mkdir -p build
          docker image inspect "$IMAGE" > build/ci-image.json

      - name: Verify pinned compiler and dependencies
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "$XOFFSET_CI_IMAGE" python3 tools/check_vm_toolchain.py \
            --profile linux-p2996 --compiler /opt/p2996-toolchain/bin/clang++ \
            --deps external --output build/ci-toolchain.json

      - name: Prepare pinned CMake for C++26 consumer targets
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      - name: Build, CTest, and signature self-check
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          docker run --rm --platform linux/amd64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/opt/p2996-toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$XOFFSET_CI_IMAGE" \
            bash ./build.sh 2>&1 | tee build/ci-build.log

      - name: Signature contract verification
        run: |
          echo "=== Checking for signature changes ==="
          echo ""

          SIG_DIR="tools/sigs"
          if [ ! -d "$SIG_DIR" ]; then
            echo "::error::Missing signature baseline directory: $SIG_DIR"
            exit 1
          fi

          SIG_STATUS="$(git status --short --untracked-files=all -- "$SIG_DIR")"
          if [ -z "$SIG_STATUS" ]; then
            echo "✓ All type signatures match committed versions."
            exit 0
          fi

          echo "$SIG_STATUS"
          echo ""
          git diff --stat -- "$SIG_DIR" || true
          echo ""
          echo "::error::Type signatures changed. Review tools/sigs/*.sig.hpp and commit intentional baseline updates."
          exit 1

      - name: Install, relocate, and consume the full package
        run: |
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/opt/p2996-toolchain/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$XOFFSET_CI_IMAGE" python3 tools/validate_vm_package.py \
            --source-dir . --out build/package-validation --suite full \
            --compiler /opt/p2996-toolchain/bin/clang++ \
            --library-dir /opt/p2996-toolchain/lib/x86_64-unknown-linux-gnu

      - name: Upload signature artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-signatures
          path: tools/sigs/*.sig.hpp
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload validation inputs and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-inputs
          path: |
            build/ci-image.json
            build/ci-toolchain.json
            build/test-inventory.json
            build/compile-checks/*.log
            build/Testing/Temporary/*.log
            build/package-validation/result.json
            build/package-validation/*.log
            build/package-validation/*manifest*.json
            build/package-validation/*.xml
            build/cmake-tool/result.json
            build/cmake-tool/files.json
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build/ci-build.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/compile-checks/*.log
            build/Testing/Temporary/*.log
          retention-days: 7
          if-no-files-found: ignore

  gcc16:
    name: Build & Test (GCC 16 Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Official gcc:16 image (GCC 16.2.0, libstdc++), pinned by digest.
      XOFFSET_GCC_IMAGE: gcc@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull GCC 16 image
        run: docker pull --platform linux/amd64 "$XOFFSET_GCC_IMAGE"

      - name: Prepare pinned CMake
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      - name: Configure, build and CTest (Debug)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin \
            "$XOFFSET_GCC_IMAGE" bash -c '
              g++ --version | head -n 1 &&
              cmake -S . -B build/gcc16 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ &&
              cmake --build build/gcc16 --parallel 4 &&
              ctest --test-dir build/gcc16 --output-on-failure --parallel 2 --timeout 900' \
            2>&1 | tee build/gcc16-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc16-result
          path: |
            build/gcc16-build.log
            build/gcc16/Testing/Temporary/*.log
            build/gcc16/compile-checks/*.log
          if-no-files-found: ignore

  cross-compiler-wire:
    name: Cross-compiler wire (P2996 Clang <-> GCC 16)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      XOFFSET_GCC_IMAGE: gcc@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull images
        run: |
          IMAGE=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["image"])')
          docker pull --platform linux/amd64 "$IMAGE"
          docker pull --platform linux/amd64 "$XOFFSET_GCC_IMAGE"
          echo "XOFFSET_CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Prepare pinned CMake
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      - name: Build the corpus tool with both compilers
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/opt/p2996-toolchain/bin:/usr/local/bin:/usr/bin:/bin \
            "$XOFFSET_CI_IMAGE" bash -c '
              cmake -S . -B build/xw-clang -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=/opt/p2996-toolchain/bin/clang++ &&
              cmake --build build/xw-clang --target test_cross_compiler_wire --parallel 4'
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin \
            "$XOFFSET_GCC_IMAGE" bash -c '
              cmake -S . -B build/xw-gcc -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ &&
              cmake --build build/xw-gcc --target test_cross_compiler_wire --parallel 4'

      # Each compiler writes the corpus and reads the other's. Reading
      # requires load_verified to accept and the bytes to equal its own.
      - name: Exchange and compare wires
        shell: bash
        run: |
          set -euo pipefail
          CLANG_RUN="docker run --rm --platform linux/amd64 -v ${{ github.workspace }}:/workspace -w /workspace \
            -e LD_LIBRARY_PATH=/opt/p2996-toolchain/lib/x86_64-unknown-linux-gnu:/opt/p2996-toolchain/lib \
            $XOFFSET_CI_IMAGE build/xw-clang/bin/Release/test_cross_compiler_wire"
          GCC_RUN="docker run --rm --platform linux/amd64 -v ${{ github.workspace }}:/workspace -w /workspace \
            $XOFFSET_GCC_IMAGE build/xw-gcc/bin/Release/test_cross_compiler_wire"
          $CLANG_RUN --write build/corpus-clang
          $GCC_RUN --write build/corpus-gcc
          $GCC_RUN --read build/corpus-clang
          $CLANG_RUN --read build/corpus-gcc
          diff -r build/corpus-clang build/corpus-gcc
          echo "P2996 Clang and GCC 16 wires are byte-identical and mutually accepted."

      - name: Upload corpora
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-compiler-wire
          path: |
            build/corpus-clang/*.xwire
            build/corpus-gcc/*.xwire
          if-no-files-found: ignore

  validation-differential:
    name: Validation differential (PR base vs PR, GCC 16 Docker)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      XOFFSET_GCC_IMAGE: gcc@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check out the PR base
        run: git worktree add --detach build/pr-base "${{ github.event.pull_request.base.sha }}"

      - name: Pull GCC 16 image
        run: docker pull --platform linux/amd64 "$XOFFSET_GCC_IMAGE"

      # Same mutated wires through typed load, reload, raw validation and
      # verified receive of both libraries: K4's accept/reject set and first
      # error messages must not change unless a PR means to change them.
      - name: Compare validation outcomes
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            "$XOFFSET_GCC_IMAGE" \
            tools/validation_differential.sh /workspace/build/pr-base /workspace 200000 1 2 \
            2>&1 | tee build/validation-differential.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-differential
          path: |
            build/validation-differential.log
            build/validation-differential/*.txt
          if-no-files-found: ignore

  bench-smoke:
    name: Benchmark trees smoke (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc16, p2996]
    env:
      XOFFSET_GCC_IMAGE: gcc@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240
      CEREAL_COMMIT: ebef1e929807629befafbb2918ea1a08c7194554

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select image
        run: |
          if [ "${{ matrix.compiler }}" = gcc16 ]; then
            echo "BENCH_IMAGE=$XOFFSET_GCC_IMAGE" >> "$GITHUB_ENV"
            echo "BENCH_CXX=g++" >> "$GITHUB_ENV"
            echo "BENCH_PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin" >> "$GITHUB_ENV"
          else
            echo "BENCH_IMAGE=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["image"])')" >> "$GITHUB_ENV"
            echo "BENCH_CXX=/opt/p2996-toolchain/bin/clang++" >> "$GITHUB_ENV"
            echo "BENCH_PATH=/workspace/build/cmake-tool/root/bin:/opt/p2996-toolchain/bin:/usr/local/bin:/usr/bin:/bin" >> "$GITHUB_ENV"
          fi

      - name: Pull image
        run: docker pull --platform linux/amd64 "$BENCH_IMAGE"

      - name: Prepare pinned CMake, cereal v1.3.2 and valgrind headers
        run: |
          python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool
          git clone --quiet --depth 1 --branch v1.3.2 https://github.com/USCiLab/cereal build/cereal-v1.3.2
          test "$(git -C build/cereal-v1.3.2 rev-parse HEAD)" = "$CEREAL_COMMIT"
          sudo apt-get update -qq && sudo apt-get install -y -qq valgrind
          mkdir -p build/valgrind-include && cp -r /usr/include/valgrind build/valgrind-include/

      - name: Build and smoke-test bench/slg and bench/formal
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH="$BENCH_PATH" \
            -e LD_LIBRARY_PATH=/opt/p2996-toolchain/lib/x86_64-unknown-linux-gnu:/opt/p2996-toolchain/lib \
            "$BENCH_IMAGE" bash bench/ci_smoke.sh "$BENCH_CXX" /workspace/build/cereal-v1.3.2/include \
              /workspace/build/valgrind-include build/bench-${{ matrix.compiler }} \
            2>&1 | tee build/bench-smoke-${{ matrix.compiler }}.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-${{ matrix.compiler }}
          path: build/bench-smoke-${{ matrix.compiler }}.log
          if-no-files-found: ignore

  gcc16-sanitizer:
    name: ASan+UBSan (GCC 16 Docker, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XOFFSET_GCC_IMAGE: gcc@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240
      # Every UBSan check is on and aborts the test (TypeLayout fe29592 made
      # the consteval signature code constant under null / nonnull-attribute /
      # returns-nonnull-attribute, which earlier needed to be excluded).
      XOFFSET_GCC_SANITIZE: >-
        -fsanitize=address,undefined
        -fno-sanitize-recover=undefined -fno-omit-frame-pointer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull GCC 16 image
        run: docker pull --platform linux/amd64 "$XOFFSET_GCC_IMAGE"

      - name: Prepare pinned CMake
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      - name: Configure, build and CTest (Debug, ASan+UBSan)
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin \
            -e XOFFSET_GCC_SANITIZE \
            -e UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            "$XOFFSET_GCC_IMAGE" bash -c '
              g++ --version | head -n 1 &&
              cmake -S . -B build/gcc16-asan -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ \
                "-DCMAKE_CXX_FLAGS=$XOFFSET_GCC_SANITIZE" \
                -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined &&
              cmake --build build/gcc16-asan --parallel 4 &&
              ctest --test-dir build/gcc16-asan --output-on-failure --parallel 2 --timeout 1800' \
            2>&1 | tee build/gcc16-asan.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc16-sanitizer-result
          path: build/gcc16-asan.log

  mapdemo-gcc16:
    name: Map state demo (GCC 16 + P2996 Docker, Release + ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XOFFSET_GCC_IMAGE: gcc@sha256:27470de79376e1033091a1f2cbfa805a10d790dcbd980389a07c4d6dc3606240
      # Same flags as gcc16-sanitizer.
      XOFFSET_GCC_SANITIZE: >-
        -fsanitize=address,undefined
        -fno-sanitize-recover=undefined -fno-omit-frame-pointer
      MAPDEMO_CONFIGURE: >-
        -DCMAKE_CXX_COMPILER=g++ -DXOFFSET_BUILD_DEMOS=ON -DXOFFSET_BUILD_TESTS=OFF
        -DXOFFSET_BUILD_TOOLS=OFF -DXOFFSET_BUILD_EXAMPLES=OFF

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull GCC 16 image
        run: docker pull --platform linux/amd64 "$XOFFSET_GCC_IMAGE"

      - name: Prepare pinned CMake
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      # Self-test, 1 / 100 / 10000 units x 500 steps with every check on, the
      # --evil online failure-input run, then summarize.py. Cloud numbers are
      # smoke only; formal timing runs on the Mac.
      - name: Release build and three tiers
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin \
            -e MAPDEMO_CONFIGURE -e MAPDEMO_LABEL="CI GCC 16 Release (smoke)" \
            "$XOFFSET_GCC_IMAGE" bash -c '
              g++ --version | head -n 1 &&
              cmake -S . -B build/mapdemo -DCMAKE_BUILD_TYPE=Release $MAPDEMO_CONFIGURE &&
              cmake --build build/mapdemo --parallel 4 &&
              demo/mapstate/tools/run_all_tiers.sh build/mapdemo/bin/Release build/mapdemo-results' \
            2>&1 | tee build/mapdemo-release.log

      # The same Release run built with the pinned P2996 Clang (the Mac
      # toolchain family), so clang-only compile errors show up here first.
      - name: P2996 Clang Release build and three tiers
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          IMAGE=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["image"])')
          docker pull --platform linux/amd64 "$IMAGE"
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/opt/p2996-toolchain/bin:/usr/local/bin:/usr/bin:/bin \
            -e LD_LIBRARY_PATH=/opt/p2996-toolchain/lib/x86_64-unknown-linux-gnu:/opt/p2996-toolchain/lib \
            -e MAPDEMO_LABEL="CI P2996 Clang Release (smoke)" \
            "$IMAGE" bash -c '
              clang++ --version | head -n 1 &&
              cmake -S . -B build/mapdemo-clang -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_COMPILER=/opt/p2996-toolchain/bin/clang++ -DXOFFSET_BUILD_DEMOS=ON \
                -DXOFFSET_BUILD_TESTS=OFF -DXOFFSET_BUILD_TOOLS=OFF -DXOFFSET_BUILD_EXAMPLES=OFF &&
              cmake --build build/mapdemo-clang --parallel 4 &&
              demo/mapstate/tools/run_all_tiers.sh build/mapdemo-clang/bin/Release build/mapdemo-clang-results' \
            2>&1 | tee build/mapdemo-clang.log

      # ASan+UBSan: self-test, the 100-unit tier and --evil.
      - name: ASan+UBSan build, 100-unit tier and evil
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --platform linux/amd64 \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin \
            -e MAPDEMO_CONFIGURE -e XOFFSET_GCC_SANITIZE \
            -e UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1 \
            -e MAPDEMO_TIERS=100 -e MAPDEMO_LABEL="CI GCC 16 Debug ASan+UBSan" \
            "$XOFFSET_GCC_IMAGE" bash -c '
              cmake -S . -B build/mapdemo-asan -DCMAKE_BUILD_TYPE=Debug $MAPDEMO_CONFIGURE \
                "-DCMAKE_CXX_FLAGS=$XOFFSET_GCC_SANITIZE" \
                -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined &&
              cmake --build build/mapdemo-asan --parallel 4 &&
              demo/mapstate/tools/run_all_tiers.sh build/mapdemo-asan/bin/Debug build/mapdemo-asan-results' \
            2>&1 | tee build/mapdemo-asan.log

      - name: Result tables
        if: always()
        run: |
          for f in build/mapdemo-results/RESULT_TABLES.md build/mapdemo-clang-results/RESULT_TABLES.md \
                   build/mapdemo-asan-results/RESULT_TABLES.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapdemo-gcc16-results
          path: |
            build/mapdemo-release.log
            build/mapdemo-clang.log
            build/mapdemo-asan.log
            build/mapdemo-results/
            build/mapdemo-clang-results/
            build/mapdemo-asan-results/
          if-no-files-found: ignore

  sanitizer:
    name: ASan+UBSan (P2996 Docker, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull P2996 Docker image
        run: |
          IMAGE=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["image"])')
          docker pull --platform linux/amd64 "$IMAGE"
          echo "XOFFSET_CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Prepare pinned CMake for C++26 consumer targets
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      # The image has no sanitizer runtime. Build a self-contained resource
      # directory: the image compiler's builtin headers plus the pinned
      # compiler-rt package (sha256 from toolchains/vm-validation.json).
      - name: Materialize sanitizer resource directory
        shell: bash
        run: |
          set -euo pipefail
          URL='https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-21/libclang-rt-21-dev_21.1.8~++20251221032922+2078da43e25a-1~exp1~20251221153059.70_amd64.deb'
          EXPECTED=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["sanitizer_runtime"]["source_package_sha256"])')
          mkdir -p build/rt-pkg build/asan-resource
          curl -fsSL "$URL" -o build/rt-pkg/compiler-rt.deb
          echo "$EXPECTED  build/rt-pkg/compiler-rt.deb" | sha256sum -c -
          dpkg-deb -x build/rt-pkg/compiler-rt.deb build/rt-pkg/x
          RT_LIB=$(find build/rt-pkg/x -type d -path '*/lib/clang/*/lib' | head -n 1)
          test -n "$RT_LIB"
          cp -rL "$RT_LIB" build/asan-resource/lib
          RES=$(docker run --rm --platform linux/amd64 "$XOFFSET_CI_IMAGE" /opt/p2996-toolchain/bin/clang++ -print-resource-dir)
          CID=$(docker create --platform linux/amd64 "$XOFFSET_CI_IMAGE")
          docker cp -L "$CID:$RES/include" build/asan-resource/include
          docker rm "$CID"
          # pipefail: head closing the pipe would fail find with SIGPIPE.
          find build/asan-resource -maxdepth 3 > build/asan-resource-listing.txt
          head -n 40 build/asan-resource-listing.txt

      - name: Run ASan+UBSan suite
        run: |
          python3 tools/validate_vm.py linux --suite full --source-dir . \
            --deps external --image "$XOFFSET_CI_IMAGE" \
            --compiler /opt/p2996-toolchain/bin/clang++ --platform linux/amd64 \
            --cmake-root build/cmake-tool/root \
            --sanitizer address-undefined --runtime-dir build/asan-resource \
            --targets test_nested,test_compaction,test_xbuffer_api,test_xhandle,test_error_paths,test_complex_nesting,test_adaptive_reservation,test_main_containers,test_runtime_regressions,test_mutation_failures,test_wire_validation,test_stable_storage,test_virtual_memory_storage,test_vm_pool,test_storage_policies,test_vm_lifecycle,test_vm_transport,test_owner_registry,test_tail_expansion,test_hot_path_constants,test_allocator_model,test_allocator_failures,test_v2_golden,test_v2_fuzz,fuzz_v2_wire_replay,fuzz_wire_schemas_replay,test_free_table_policy,test_owner_identity,test_assign_range,test_verified_receive,test_scalar_resize \
            --jobs 2 --out build/sanitizer-result

      - name: Upload sanitizer results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-result
          path: |
            build/sanitizer-result/*.json
            build/sanitizer-result/*.log
            build/sanitizer-result/*.xml
          if-no-files-found: ignore
