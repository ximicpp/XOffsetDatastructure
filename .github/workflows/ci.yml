name: CI

on:
  push:
    branches: [ main, master, next_cpp26 ]
  pull_request:
    branches: [ main, master, next_cpp26 ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (P2996 Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify checkout
        run: |
          echo "=== Repository ==="
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo ""
          echo "=== Submodules ==="
          git submodule status
          echo ""
          echo "=== TypeLayout check ==="
          ls -la external/typelayout/include/boost/typelayout.hpp
          echo ""
          echo "=== Test files ==="
          ls tests/test_*.cpp | wc -l
          echo "test files found"

      - name: Pull P2996 Docker image
        run: |
          echo "Pulling pre-built P2996 Docker image..."
          docker pull ghcr.io/ximicpp/typelayout-p2996:latest
          echo ""
          echo "=== Image info ==="
          docker images ghcr.io/ximicpp/typelayout-p2996:latest

      - name: Build & run all tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/ximicpp/typelayout-p2996:latest \
            bash ./build.sh

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7