name: CI

on:
  push:
    branches: [ main, master, next_cpp26 ]
  pull_request:
    branches: [ main, master, next_cpp26 ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (P2996 Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify checkout
        run: |
          echo "=== Repository ==="
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo ""
          echo "=== Submodules ==="
          git submodule status
          echo ""
          echo "=== TypeLayout check ==="
          ls -la external/typelayout/include/boost/typelayout.hpp
          echo ""
          echo "=== Test files ==="
          ls tests/test_*.cpp | wc -l
          echo "test files found"

      - name: Pull P2996 Docker image
        run: |
          echo "Pulling pre-built P2996 Docker image..."
          docker pull ghcr.io/ximicpp/typelayout-p2996:latest
          echo ""
          echo "=== Image info ==="
          docker images ghcr.io/ximicpp/typelayout-p2996:latest

      - name: Build, CTest, and signature self-check
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/ximicpp/typelayout-p2996:latest \
            bash ./build.sh 2>&1 | tee build/ci-build.log

      - name: Signature contract verification
        run: |
          echo "=== Checking for signature changes ==="
          echo ""

          SIG_DIR="tools/sigs"
          if [ ! -d "$SIG_DIR" ]; then
            echo "::error::Missing signature baseline directory: $SIG_DIR"
            exit 1
          fi

          SIG_STATUS="$(git status --short --untracked-files=all -- "$SIG_DIR")"
          if [ -z "$SIG_STATUS" ]; then
            echo "✓ All type signatures match committed versions."
            exit 0
          fi

          echo "$SIG_STATUS"
          echo ""
          git diff --stat -- "$SIG_DIR" || true
          echo ""
          echo "::error::Type signatures changed. Review tools/sigs/*.sig.hpp and commit intentional baseline updates."
          exit 1

      - name: Upload signature artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-signatures
          path: tools/sigs/*.sig.hpp
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build/ci-build.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore
