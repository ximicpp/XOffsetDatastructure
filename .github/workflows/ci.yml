name: CI

on:
  push:
    branches: [ main, master, next_cpp26 ]
  pull_request:
    branches: [ main, master, next_cpp26 ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (P2996 Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify checkout
        run: |
          echo "=== Repository ==="
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch: $(git branch --show-current)"
          echo ""
          echo "=== Submodules ==="
          git submodule status
          echo ""
          echo "=== TypeLayout check ==="
          ls -la external/typelayout/include/boost/typelayout.hpp
          echo ""
          echo "=== Test files ==="
          ls tests/test_*.cpp | wc -l
          echo "test files found"

      - name: Pull P2996 Docker image
        run: |
          echo "Pulling pre-built P2996 Docker image..."
          docker pull ghcr.io/ximicpp/typelayout-p2996:latest
          echo ""
          echo "=== Image info ==="
          docker images ghcr.io/ximicpp/typelayout-p2996:latest

      - name: Build & run all tests
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/ximicpp/typelayout-p2996:latest \
            bash ./build.sh 2>&1 | tee build/ci-build.log

      - name: Signature contract verification
        run: |
          echo "=== Checking for signature changes ==="
          echo ""

          # The build.sh run above regenerated tools/sigs/*.sig.hpp inside Docker.
          # Compare them against the committed versions to detect binary contract drift.

          SIG_DIR="tools/sigs"
          if [ ! -d "$SIG_DIR" ]; then
            echo "No signature directory found — skipping."
            exit 0
          fi

          CHANGED=0
          for sig_file in "$SIG_DIR"/*.sig.hpp; do
            [ -f "$sig_file" ] || continue
            FNAME=$(basename "$sig_file")

            # Use git diff to detect uncommitted changes
            if ! git diff --quiet -- "$sig_file" 2>/dev/null; then
              echo "⚠ CHANGED: $FNAME"
              echo "  Binary contract may have changed — please review!"
              git diff --stat -- "$sig_file"
              echo ""
              CHANGED=1
            else
              echo "✓ $FNAME — unchanged"
            fi
          done

          echo ""
          if [ "$CHANGED" -eq 1 ]; then
            echo "::warning::Type signatures have changed! Review tools/sigs/*.sig.hpp for binary contract drift."
            echo ""
            echo "If this is intentional, commit the updated .sig.hpp files."
          else
            echo "✓ All type signatures match committed versions."
          fi

      - name: Upload signature artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-signatures
          path: tools/sigs/*.sig.hpp
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: |
            build/ci-build.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
          if-no-files-found: ignore
