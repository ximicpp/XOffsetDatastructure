name: Fuzz

# G5: coverage-guided libFuzzer runs of the V2 validators (fuzz_v2_wire, and
# fuzz_wire_schemas over three more schemas) under ASan+UBSan, one job per
# target.
#
# Modes:
#   pr       pushes to next_cpp26 and pull requests into it: 300 s per target,
#            one process, stops at the first crash.
#   nightly  started every night by .github/workflows/nightly-fuzz-dispatch.yml
#            on main (GitHub reads `schedule` only from the default branch):
#            3600 s per target, 4 processes, keeps going after a crash.
#   manual   workflow_dispatch with `seconds`, run like nightly; also the
#            pre-merge long run for a branch: gh workflow run fuzz.yml
#            --ref <branch> -f mode=manual -f seconds=3600
#
# Each target keeps its own corpus in the Actions cache, merged (-merge=1)
# before it is saved. Nightly and manual runs also upload the merged corpus;
# a run that finds no cache starts from the latest such upload on next_cpp26.
# Crash, leak, timeout and OOM inputs are replayed, minimized and given a
# signature by tools/fuzz_findings.py, which writes findings.json into the
# fuzz-<target> artifact. A job fails when it has findings, not on the
# fuzzer's exit code alone.

on:
  push:
    branches: [ next_cpp26 ]
  pull_request:
    branches: [ next_cpp26 ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr (300 s, 1 process), nightly (3600 s, 4 processes) or manual (seconds below, 4 processes)'
        type: choice
        options: [ manual, nightly, pr ]
        default: manual
      seconds:
        description: 'manual: fuzzing seconds per target (at most 16200)'
        default: '3600'
      inject_crash:
        description: 'Drill: build with XOFFSET_FUZZ_INJECT_CRASH and feed the XOFFSET-INJECT input'
        type: boolean
        default: false
      watch_hours:
        description: 'Drill for the nightly watch: report when the last nightly run is older than this'
        default: ''

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Fuzz {0}{1}{2} · {3}', inputs.mode,
                inputs.mode == 'manual' && format(' {0}s', inputs.seconds) || '',
                inputs.inject_crash && ' inject' || '',
                github.ref_name)
      || format('Fuzz pr · {0}', github.event_name == 'pull_request' && github.event.pull_request.title || github.ref_name) }}

permissions:
  contents: read
  actions: read   # corpus fallback: list and download artifacts of earlier runs

# One run per mode and ref at a time; a newer push to a pull request replaces
# its running fuzz, nightly and manual runs queue instead.
concurrency:
  group: fuzz-${{ inputs.mode || 'pr' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  XOFFSET_FUZZ_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr' }}
  XOFFSET_FUZZ_INJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.inject_crash || false }}

jobs:
  libfuzzer:
    name: libFuzzer ${{ matrix.target }} (P2996 Docker, ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'manual' && 330 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: v2_wire
            seeds: test_v2_fuzz --write-corpus
            build: test_v2_fuzz fuzz_v2_wire
          - target: wire_schemas
            seeds: fuzz_wire_schemas_seeds
            build: fuzz_wire_schemas fuzz_wire_schemas_seeds
    env:
      T: ${{ matrix.target }}
      FUZZER: build/fuzz/bin/Debug/fuzz_${{ matrix.target }}
      # Shared by fuzzing, merging, replay and minimization.
      FUZZ_FLAGS: -max_len=262144 -rss_limit_mb=2048 -timeout=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fuzzing budget
        shell: bash
        run: |
          set -euo pipefail
          case "$XOFFSET_FUZZ_MODE" in
            pr)      SECS=300;  EXTRA="" ;;
            nightly) SECS=3600; EXTRA="-fork=4 -ignore_crashes=1 -ignore_ooms=1 -ignore_timeouts=1 -use_value_profile=1" ;;
            manual)  SECS="${{ inputs.seconds }}"
                     EXTRA="-fork=4 -ignore_crashes=1 -ignore_ooms=1 -ignore_timeouts=1 -use_value_profile=1" ;;
            *) echo "::error::unknown mode '$XOFFSET_FUZZ_MODE'"; exit 1 ;;
          esac
          if ! [[ "$SECS" =~ ^[0-9]+$ ]] || [ "$SECS" -lt 10 ] || [ "$SECS" -gt 16200 ]; then
            echo "::error::seconds must be an integer from 10 to 16200, got '$SECS'"; exit 1
          fi
          {
            echo "XOFFSET_FUZZ_SECONDS=$SECS"
            echo "FUZZ_MODE_FLAGS=$EXTRA"
          } >> "$GITHUB_ENV"
          mkdir -p "build/fuzz-report/$T"
          echo "$XOFFSET_FUZZ_MODE: $SECS s for $T, flags: $FUZZ_FLAGS $EXTRA, inject=$XOFFSET_FUZZ_INJECT"

      - name: Pull P2996 Docker image
        run: |
          IMAGE=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["image"])')
          docker pull --platform linux/amd64 "$IMAGE"
          echo "XOFFSET_CI_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Prepare pinned CMake
        run: python3 tools/prepare_vm_cmake.py --platform linux-x86_64 --out build/cmake-tool

      # Same resource directory as the ci.yml sanitizer job: the image's
      # builtin headers plus the pinned compiler-rt package, which also
      # carries the libFuzzer runtime.
      - name: Materialize sanitizer and fuzzer resource directory
        shell: bash
        run: |
          set -euo pipefail
          URL='https://apt.llvm.org/noble/pool/main/l/llvm-toolchain-21/libclang-rt-21-dev_21.1.8~++20251221032922+2078da43e25a-1~exp1~20251221153059.70_amd64.deb'
          EXPECTED=$(python3 -c 'import json; print(json.load(open("toolchains/vm-validation.json"))["profiles"]["linux-p2996"]["sanitizer_runtime"]["source_package_sha256"])')
          mkdir -p build/rt-pkg build/fuzz-resource
          curl -fsSL "$URL" -o build/rt-pkg/compiler-rt.deb
          echo "$EXPECTED  build/rt-pkg/compiler-rt.deb" | sha256sum -c -
          dpkg-deb -x build/rt-pkg/compiler-rt.deb build/rt-pkg/x
          RT_LIB=$(find build/rt-pkg/x -type d -path '*/lib/clang/*/lib' | head -n 1)
          test -n "$RT_LIB"
          cp -rL "$RT_LIB" build/fuzz-resource/lib
          RES=$(docker run --rm --platform linux/amd64 "$XOFFSET_CI_IMAGE" /opt/p2996-toolchain/bin/clang++ -print-resource-dir)
          CID=$(docker create --platform linux/amd64 "$XOFFSET_CI_IMAGE")
          docker cp -L "$CID:$RES/include" build/fuzz-resource/include
          docker rm "$CID"
          find build/fuzz-resource -name '*fuzzer*' | tee build/fuzz-runtime-listing.txt
          test -s build/fuzz-runtime-listing.txt

      # Every later command runs in the image through this wrapper, with the
      # workspace at /workspace, so paths are the same inside and outside.
      - name: Docker wrapper
        shell: bash
        run: |
          set -euo pipefail
          SANITIZER="halt_on_error=1"
          if docker run --rm --platform linux/amd64 "$XOFFSET_CI_IMAGE" test -x /opt/p2996-toolchain/bin/llvm-symbolizer; then
            SANITIZER="$SANITIZER:external_symbolizer_path=/opt/p2996-toolchain/bin/llvm-symbolizer"
          else
            echo "::warning::no llvm-symbolizer in the image; stacks and signatures will lack function names"
          fi
          cat > build/xo-docker <<EOF
          #!/bin/bash
          exec docker run --rm --platform linux/amd64 \\
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \\
            -v "$GITHUB_WORKSPACE/build/fuzz-resource:/runtime:ro" \\
            -e PATH=/workspace/build/cmake-tool/root/bin:/usr/local/bin:/usr/bin:/bin \\
            -e ASAN_OPTIONS=detect_leaks=1:$SANITIZER \\
            -e UBSAN_OPTIONS=print_stacktrace=1:$SANITIZER \\
            -e T -e FUZZER -e FUZZ_FLAGS -e FUZZ_MODE_FLAGS -e XOFFSET_FUZZ_SECONDS -e XOFFSET_FUZZ_INJECT \\
            "$XOFFSET_CI_IMAGE" "\$@"
          EOF
          chmod +x build/xo-docker
          cat build/xo-docker

      - name: Restore corpus
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # A cache miss (evicted, or a branch that cannot read next_cpp26's
      # cache) falls back to the newest corpus uploaded by a nightly or
      # manual run on next_cpp26.
      - name: Corpus fallback from the latest next_cpp26 upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          DIR="build/fuzz-corpus/$T"
          mkdir -p "$DIR"
          SOURCE="cache $MATCHED"
          if [ -z "$MATCHED" ]; then
            SOURCE=none
            ROW=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=fuzz-corpus-$T&per_page=50" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "next_cpp26")][0] // empty | "\(.id) \(.workflow_run.id)"' || true)
            if [ -n "$ROW" ]; then
              read -r ART RUN <<< "$ROW"
              if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART/zip" > build/corpus-fallback.zip \
                 && unzip -q -o build/corpus-fallback.zip -d "$DIR"; then
                SOURCE="artifact of run $RUN"
              else
                echo "::warning::could not download corpus artifact $ART of run $RUN; starting from seeds"
              fi
            fi
          fi
          FILES=$(find "$DIR" -type f | wc -l)
          BYTES=$(find "$DIR" -type f -printf '%s\n' | awk '{s += $1} END {print s + 0}')
          echo "$FILES $BYTES $SOURCE" | tee "build/fuzz-report/$T/before.txt"

      - name: Build and smoke
        shell: bash
        run: |
          set -o pipefail
          EXTRA_CXX=""
          if [ "$XOFFSET_FUZZ_INJECT" = true ]; then EXTRA_CXX="-DXOFFSET_FUZZ_INJECT_CRASH=1"; fi
          build/xo-docker bash -euo pipefail -c "
            cmake -S . -B build/fuzz -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_COMPILER=/opt/p2996-toolchain/bin/clang++ \
              '-DCMAKE_CXX_FLAGS=-O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -resource-dir=/runtime $EXTRA_CXX' \
              -DCMAKE_BUILD_RPATH=/opt/p2996-toolchain/lib/x86_64-unknown-linux-gnu \
              -DXOFFSET_BUILD_FUZZERS=ON -DXOFFSET_BUILD_EXAMPLES=OFF -DXOFFSET_BUILD_TOOLS=OFF \
              -DXOFFSET_FUZZER_LINK_LIBS=-l:libstdc++.so.6
            cmake --build build/fuzz --parallel 4 --target ${{ matrix.build }}
            ctest --test-dir build/fuzz -R '^fuzz_${T}_' --output-on-failure" \
            2>&1 | tee "build/build-$T.log"

      # The fuzzer's exit code is recorded, not acted on here: a crash in pr
      # mode exits non-zero and still needs the merge and findings steps.
      - name: Fuzz
        id: fuzz
        shell: bash
        run: |
          set -o pipefail
          build/xo-docker bash -uo pipefail -c '
            set -e
            BIN=build/fuzz/bin/Debug
            mkdir -p build/fuzz-seeds/$T build/fuzz-work/$T build/fuzz-artifacts
            $BIN/${{ matrix.seeds }} build/fuzz-seeds/$T
            if [ "$XOFFSET_FUZZ_INJECT" = true ]; then
              # Run the drill input on its own: fork mode drops crashing
              # initial-corpus inputs without saving them as artifacts, and
              # libFuzzer never saves an input file it is given directly, so
              # a crash is copied into the artifacts here.
              mkdir -p build/fuzz-inject
              IN=build/fuzz-inject/XOFFSET-INJECT
              printf "XOFFSET-INJECT" > $IN
              if ! $FUZZER $FUZZ_FLAGS $IN; then
                cp $IN build/fuzz-artifacts/$T-crash-$(sha1sum < $IN | cut -c1-40)
              fi
            fi
            if [ -n "$FUZZ_MODE_FLAGS" ]; then
              # Fork mode also skips crashing initial-corpus inputs silently,
              # so replay the restored corpus once in a single process first.
              $FUZZER -runs=0 $FUZZ_FLAGS -artifact_prefix=build/fuzz-artifacts/$T- \
                build/fuzz-corpus/$T build/fuzz-seeds/$T || echo "corpus replay failed (exit $?)"
            fi
            set +e
            # New inputs go to fuzz-work (the first directory); the restored
            # corpus and the seeds are read only.
            $FUZZER -max_total_time=$XOFFSET_FUZZ_SECONDS $FUZZ_FLAGS $FUZZ_MODE_FLAGS -print_final_stats=1 \
              -artifact_prefix=build/fuzz-artifacts/$T- \
              build/fuzz-work/$T build/fuzz-corpus/$T build/fuzz-seeds/$T
            echo $? > build/fuzz-exit-$T' \
            2>&1 | tee "build/fuzz-$T.log"
          echo "fuzzer exit code: $(cat "build/fuzz-exit-$T" 2>/dev/null || echo missing)"

      # Value profile is on for every merge, so a pr-mode run on next_cpp26
      # does not drop the inputs a nightly run kept for value-profile features.
      - name: Merge corpus
        if: always() && steps.fuzz.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          build/xo-docker bash -euo pipefail -c '
            rm -rf build/fuzz-merged/$T && mkdir -p build/fuzz-merged/$T
            $FUZZER -merge=1 -use_value_profile=1 $FUZZ_FLAGS \
              build/fuzz-merged/$T build/fuzz-corpus/$T build/fuzz-work/$T build/fuzz-seeds/$T
            rm -rf build/fuzz-corpus/$T && mv build/fuzz-merged/$T build/fuzz-corpus/$T' \
            2>&1 | tee "build/fuzz-report/$T/merge.log"
          build/xo-docker bash -c '$FUZZER -runs=0 $FUZZ_FLAGS build/fuzz-corpus/$T' \
            > "build/fuzz-report/$T/corpus.log" 2>&1 || true
          grep -m1 INITED "build/fuzz-report/$T/corpus.log" || true
          echo "XOFFSET_FUZZ_MERGED=1" >> "$GITHUB_ENV"

      - name: Replay, minimize and sign findings
        if: always() && steps.fuzz.outcome == 'success'
        run: >-
          python3 tools/fuzz_findings.py findings --target "$T" --bin "$FUZZER" --flags="$FUZZ_FLAGS"
          --artifacts build/fuzz-artifacts --out "build/fuzz-report/$T"

      - name: Summary
        if: always() && steps.fuzz.outcome == 'success'
        run: >-
          python3 tools/fuzz_findings.py summary --target "$T" --mode "$XOFFSET_FUZZ_MODE"
          --seconds "$XOFFSET_FUZZ_SECONDS" --log "build/fuzz-$T.log"
          --before "build/fuzz-report/$T/before.txt" --corpus "build/fuzz-corpus/$T"
          --corpus-log "build/fuzz-report/$T/corpus.log" --merge-log "build/fuzz-report/$T/merge.log"
          --exit-file "build/fuzz-exit-$T" --findings "build/fuzz-report/$T/findings.json"
          --out "build/fuzz-report/$T"

      # Drill runs carry the XOFFSET-INJECT input and stay out of the cache.
      - name: Save corpus
        if: always() && env.XOFFSET_FUZZ_MERGED == '1' && env.XOFFSET_FUZZ_INJECT != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/fuzz-corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload corpus
        if: >-
          always() && env.XOFFSET_FUZZ_MERGED == '1' && env.XOFFSET_FUZZ_INJECT != 'true'
          && env.XOFFSET_FUZZ_MODE != 'pr'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: build/fuzz-corpus/${{ matrix.target }}
          retention-days: 90

      - name: Upload log, findings and crashing inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            build/build-${{ matrix.target }}.log
            build/fuzz-${{ matrix.target }}.log
            build/fuzz-artifacts/
            build/fuzz-report/${{ matrix.target }}/

      - name: Verdict
        if: always() && steps.fuzz.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          N=$(python3 -c 'import json, sys; print(len(json.load(open(sys.argv[1]))["findings"]))' "build/fuzz-report/$T/findings.json")
          CODE=$(cat "build/fuzz-exit-$T" 2>/dev/null || echo missing)
          if [ "$N" != 0 ]; then
            echo "::error::$T: $N finding(s), see findings.json in the fuzz-$T artifact"; exit 1
          fi
          if [ "$CODE" != 0 ]; then
            echo "::error::$T: fuzzer exited with '$CODE' and left no crash, leak, timeout or oom input"; exit 1
          fi
          echo "$T: no findings"
