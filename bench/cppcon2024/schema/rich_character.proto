syntax = "proto3";
package protobuf_rich;

message Position {
    float x = 1;
    float y = 2;
    float z = 3;
}

message Affix {
    uint32 attr_id = 1;
    float value = 2;
}

message Gem {
    uint32 id = 1;
    uint32 tier = 2;
    string name = 3;
    repeated Affix bonuses = 4;
}

message RichItem {
    uint32 id = 1;
    uint64 uuid = 2;
    uint32 number = 3;
    uint64 timestamp = 4;
    string name = 5;
    repeated Affix affixes = 6;
    repeated uint32 flags = 7;
}

message RichEquip {
    uint32 id = 1;
    uint64 uuid = 2;
    uint32 number = 3;
    uint64 timestamp = 4;
    uint32 level = 5;
    string name = 6;
    string creator = 7;
    repeated float attributes = 8;
    repeated Gem gems = 9;
}

message SkillEffect {
    uint32 effect_id = 1;
    float magnitude = 2;
    float duration = 3;
    string tag = 4;
}

message RichSkill {
    uint32 id = 1;
    uint32 level = 2;
    uint32 cooldown_ms = 3;
    string name = 4;
    repeated SkillEffect effects = 5;
}

message QuestObjective {
    uint32 target_id = 1;
    uint32 current = 2;
    uint32 required = 3;
    string desc = 4;
}

message Quest {
    uint32 quest_id = 1;
    uint32 status = 2;
    uint64 accepted_at = 3;
    string title = 4;
    repeated QuestObjective objectives = 5;
}

message RichCharacter {
    uint64 id = 1;
    string name = 2;
    string guild_name = 3;
    string title = 4;
    uint32 level = 5;
    float healthpoint = 6;
    float manapoint = 7;
    float speed = 8;
    Position pos = 9;
    map<uint64, RichItem> items = 10;
    repeated Position path = 11;
    repeated float attributes = 12;
    repeated RichEquip equips = 13;
    repeated RichSkill skills = 14;
    map<uint32, Quest> quests = 15;
}
